name: Daily Run test.py at Beijing 9:00

on:
  schedule:
    # 北京时间每天 9:00 → UTC 时间 1:00
    - cron: '0 1 * * *'
  workflow_dispatch:  # 允许手动触发，便于调试

jobs:
  run-test:
    runs-on: ubuntu-latest
    environment: TOKEN   # ⬅️ 指定环境名称（需先在 Settings → Environments 中创建）
    env:                     # ⬅️ 将环境变量放在 Job 级别，所有步骤都可使用
      TOKEN_LIST: ${{ secrets.TOKEN_LIST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'  # 可改为具体版本，如 '3.11'

      - name: Install dependencies (if any)
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt found, skipping installation."
          fi
        # 此处不再单独设置 env，因为 Job 级别已设置

      - name: Run test.py
        run: |
          pip3 install -r requirements.txt
          python3 JLC.py
        # 同样，env 继承自 Job，无需重复设置
